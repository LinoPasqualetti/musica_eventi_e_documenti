<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spartito</title>
  <!-- Librerie vendor (sostituite in fase di build con inline) -->
  
  
  <link rel="stylesheet" href="css/spartito-viewer.css">
  
</head>
<body>
<div class="wrap">

  <header>
    <h1>Spartito</h1>
    <p class="subtitle">Incolla ABC/MusicXML o carica un file .abc / .xml / .mxl</p>
  </header>

  <!-- ===== SOURCE PANEL (solo in standalone) ===== -->
  <section class="panel" id="source-panel">
    <label for="inputText" style="display:block;font-size:0.88rem;color:var(--ink-soft);margin-bottom:6px;">
      Testo ABC o MusicXML
    </label>
    <textarea id="inputText"
      style="width:100%;min-height:120px;font-family:monospace;font-size:0.85rem;padding:8px;border:1px solid var(--paper-line);border-radius:3px;background:#fff;resize:vertical;"
      placeholder="X:1&#10;T:Titolo&#10;M:4/4&#10;L:1/8&#10;K:C&#10;C2 D2 E2 F2 | G4 z4 |"></textarea>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px;">
      <div style="flex:1;min-width:200px;">
        <input type="file" id="fileInput" accept=".abc,.xml,.musicxml,.mxl,*/*"
          style="width:100%;font-size:0.85rem;padding:6px;border:1px dashed var(--paper-line);border-radius:3px;background:#fff;">
      </div>
      <button id="processBtn" class="ctrl-btn primary">Genera spartito</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <!-- ===== OUTPUT PANEL ===== -->
  <section id="output-panel" style="display:none;">

    <!-- Pulsantiera compattabile -->
    <div id="controls-bar">
      <div id="controls-header">
        <button id="controls-toggle" title="Comprimi/Espandi">▾</button>
        <span id="current-title" style="font-weight:600;color:var(--brass-dark);font-size:0.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;"></span>
        <span id="controls-summary" style="margin-left:auto;font-size:0.8rem;color:var(--ink-soft);"></span>
        <button id="openFileBtn" class="ctrl-btn" title="Apri un altro file" style="margin-left:8px;">📁 Apri</button>
      </div>
      <div id="controls-content">
        <div class="ctrl-field" id="tune-selector-wrap" style="display:none;">
          <label for="tuneSel">Brano</label>
          <select id="tuneSel" style="max-width:220px;"></select>
        </div>
        <div class="ctrl-field">
          <label for="instrumentSel">Strumento</label>
          <select id="instrumentSel"></select>
        </div>
        <div class="ctrl-field">
          <label for="transposeSel">Semitoni</label>
          <select id="transposeSel"></select>
        </div>
        <div class="ctrl-field">
          <label for="octaveSel">Ottave</label>
          <select id="octaveSel">
            <option value="-2">-2 ottave</option>
            <option value="-1">-1 ottava</option>
            <option value="0" selected>Originale</option>
            <option value="1">+1 ottava</option>
            <option value="2">+2 ottave</option>
          </select>
        </div>
        <div class="ctrl-field">
          <label for="measuresPerLine">Battute/riga</label>
          <select id="measuresPerLine">
            <option value="0">Auto</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </div>
        <div id="zoom-group">
          <button class="ctrl-btn" id="zoomOut" title="Riduci">−</button>
          <span id="zoom-level">100%</span>
          <button class="ctrl-btn" id="zoomIn" title="Ingrandisci">+</button>
          <button class="ctrl-btn" id="zoomReset" title="Reset">↺</button>
        </div>
        <div id="audio-controls"></div>
        <button class="ctrl-btn" id="stopBtn" title="Ferma">■ Stop</button>
        <a id="downloadBtn" class="ctrl-btn" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px;" download>
          ⬇ Scarica
        </a>
      </div>
    </div>

    <!-- Selezione tracce -->
    <div id="tracks-container" style="display:none;">
      <span style="font-size:0.8rem;color:var(--ink-soft);margin-right:6px;">🎵 Tracce:</span>
    </div>

    <!-- Spartito -->
    <div id="sheet-wrap">
      <div id="sheet-music"></div>
    </div>

    <details style="margin-top:12px;">
      <summary style="cursor:pointer;color:var(--brass-dark);font-size:0.85rem;">Mostra codice ABC generato</summary>
      <textarea id="abc-output" readonly
        style="width:100%;min-height:120px;font-family:monospace;font-size:0.82rem;margin-top:6px;padding:8px;border:1px solid var(--paper-line);border-radius:3px;background:#fff;"></textarea>
    </details>
  </section>

</div>


  <script src="js/vendor/abcjs_basic_6.6.4.js"></script>
  <script src="js/vendor/jszip_3.10.1.js"></script>
  <script src="js/app/main.js"></script>
</body>
</html>
