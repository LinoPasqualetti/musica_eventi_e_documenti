name: musica_eventi_e_documenti
description: "App per la gestione di eventi musicali live inclusivi - Musica per Tutti"
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'  # ✅ Compatibile con Dart 3.10.7

dependencies:
    webview_flutter: ^4.8.0
    flutter:
        sdk: flutter

    # ============================================
    # DATABASE SQLite
    # ============================================
    sqflite: ^2.3.3+1
    sqflite_common_ffi: ^2.3.3+1
    sqflite_common_ffi_web: ^1.1.0
    path_provider: ^2.1.3
    path: ^1.9.0

    # ============================================
    # AUTENTICAZIONE E SICUREZZA
    # ============================================
    crypto: ^3.0.3

    # ============================================
    # UI E UTILITÀ
    # ============================================
    cupertino_icons: ^1.0.6
    intl: ^0.19.0
    share_plus: ^10.1.4
    image_picker: ^1.1.2
    file_picker: ^8.3.7
    flutter_local_notifications: ^18.0.1
    url_launcher: ^6.3.1
    connectivity_plus: ^6.1.3
    open_filex: ^4.3.4
    android_intent_plus: ^5.1.0

    # ============================================
    # AUDIO E SPARTITI
    # ============================================
    audioplayers: ^6.4.0
    pdf: ^3.11.3
    printing: ^5.13.4
    qr: ^3.0.2
    #flutter_midi_command: ^0.5.0

    # ============================================
    # GESTIONE FILE MXL (MusicXML compresso)
    # ============================================
    archive: ^4.0.7
    xml: ^6.5.0
    http: ^1.2.2

    # ============================================
    # VISUALIZZAZIONE DOCUMENTI ABC e MXL
    # (spartito-viewer.html in InAppWebView)
    # ============================================
    flutter_inappwebview: ^6.1.5

    # ============================================
    # STATO E NAVIGAZIONE
    # ============================================
    provider: ^6.1.2
    flutter_riverpod: ^2.6.1
    riverpod: ^2.6.1

    # ============================================
    # STORAGE LOCALE
    # ============================================
    shared_preferences: ^2.3.5

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0

flutter:
    uses-material-design: true

    assets:
        - assets/db/
        - assets/images/
        - assets/sheets/
        - assets/audio/
        - assets/html/
        - assets/html/js/          # 🔥 AGGIUNTO PER MIDI.JS
        - assets/html/soundfonts/  # 🔥 AGGIUNTO PER SOUNDFONT