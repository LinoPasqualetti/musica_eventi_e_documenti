<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Musica per Tutti - Eventi e Documenti">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="musica_eventi_e_documenti">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>🎵 Musica per Tutti</title>
  <link rel="manifest" href="manifest.json">

  <!-- SQFLITE WEB WORKER - CARICAMENTO -->
  <script>
    // Service Worker per SQLite su web
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sqflite_sw.js')
        .then(function(registration) {
          console.log('✅ Service Worker SQLite registrato con successo');
        })
        .catch(function(error) {
          console.log('❌ Registrazione Service Worker SQLite fallita:', error);
        });
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
    }

    #loading {
      color: white;
      text-align: center;
      padding: 20px;
    }

    #loading .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading h1 {
      font-size: 24px;
      margin: 0 0 10px 0;
      font-weight: 300;
    }

    #loading p {
      font-size: 14px;
      opacity: 0.8;
      margin: 0;
    }

    .flutter-loader {
      display: none !important;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="loading">
    <div class="spinner"></div>
    <h1>🎵 Musica per Tutti</h1>
    <p>Caricamento in corso...</p>
  </div>
</div>

<!-- Caricamento Flutter -->
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
